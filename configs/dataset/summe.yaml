# SumMe Dataset Configuration
# SumMe数据集配置文件

# Basic dataset information
# 基本数据集信息

# 数据集名称
dataset_name: "SumMe"
# 数据集文件夹
dataset_dir: "/root/autodl-tmp/datasets/SumMe"
# 数据集视频文件目录
video_dir: "/root/autodl-tmp/datasets/SumMe/videos"
# 数据集h5特征文件路径
h5file_path: "/root/autodl-tmp/datasets/eccv16_dataset_summe_google_pool5.h5"
# 数据集划分文件路径
split_files:
  split_5: "/root/autodl-tmp/datasets/splits/summe_splits_5.json"
  split_50: "/root/autodl-tmp/datasets/splits/summe_splits_50.json"
# 原视频名与视频标号名称的映射文件路径
video_name_mapping_file_path: "/root/autodl-tmp/datasets/summe_mapping.json"

# Some less critical parameters
# 一些不太关键的参数

# 视频文件扩展名
video_extension: ".mp4"
