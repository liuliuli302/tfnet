# 0 有关数据集的参数
datasets:
  summe:
    root_dir: "/root/autodl-tmp/data/SumMe"
    frames_dir: "/root/autodl-tmp/data/SumMe/frames"
    videos_dir: "/root/autodl-tmp/data/SumMe/videos"
    frame_captions_dir: "/root/tfnet/data/captions/frame_caption"
    video_captions_dir: "/root/tfnet/data/captions/video_caption"
    nfs_dir: "/root/tfnet/data/nfs"
  tvsum:
    root_dir: "/root/autodl-tmp/data/TVSum"
    frames_dir: "/root/autodl-tmp/data/TVSum/frames"
    videos_dir: "/root/autodl-tmp/data/TVSum/videos"
    frame_captions_dir: "/root/tfnet/data/captions/frame_caption"
    video_captions_dir: "/root/tfnet/data/captions/video_caption"
    nfs_dir: "/root/tfnet/data/nfs"

# 1 nfs 非均匀采样设置
nfs:
  out_dir: "/root/tfnet/data/nfs"
  batch_size: 64
  frame_interval: 1
  divlam: 5

# 模型配置
# w: with, wo: without
# e: explainability 可解释性
# s: summary 表示这个视频的整个文本摘要

llmquery:
  models:
    text_modal:
      - "moonshot-v1-128k"
      - "deepseek-r1"
    multi_modal:
      - "moonshot-v1-128k"
  # 查询方法
  query_type:
    - "text_ws_woe"
    - "text_ws_we"
    - "text_wos_woe"
    - "text_wos_we"
    # - "visual_ws_woe"
    # - "visual_ws_we"
    # - "visual_wos_woe"
    # - "visual_wos_we"
  # 提示模板
  prompts:
    text_wos_woe: |
      You are an expert video summarizer. Given the caption of a single video frame, your task is to:

      Assign an importance score between 0 (not important at all) and 1 (extremely important) indicating how likely this frame should be included in the final video summary.

      Caption: {frame_caption}

      Output in the following format (without any extra text):

      Score: <float between 0.00 and 1.00>

    text_wos_we: |
      You are an expert video summarizer. Given the caption of a single video frame, your task is to:

      1. Assign an importance score between 0 (not important at all) and 1 (extremely important) indicating how likely this frame should be included in the final video summary.
      2. Provide a brief explanation (1–2 sentences) justifying your score, focusing on why this frame is or isn’t key to understanding the video’s main events or narrative.

      Caption: {frame_caption}

      Output in the following format (without any extra text):

      Score: <float between 0.00 and 1.00>  
      Explanation: <your concise justification>

    text_ws_woe: |
      You are an expert video summarizer. Given:

      1. The overall summary of the video;
      2. The caption describing a single video frame;

      Your task is to:
      Assign an importance score between 0 (not important at all) and 1 (extremely important) indicating how likely this frame should be included in the final video summary.

      Video Summary: {video_summary}  
      Caption: {frame_caption}

      Output format (no extra text):

      Score: <float between 0.00 and 1.00>

    text_ws_we: |
      You are an expert video summarizer. Given:

      1. The overall summary of the video;
      2. The caption describing a single video frame;

      Your task is to:
      1. Assign an importance score between 0 (not important at all) and 1 (extremely important) indicating how likely this frame should be included in the final video summary.
      2. Provide a concise explanation (1–2 sentences) for your score, referencing how relevant this frame is to the overall summary.

      Video Summary: {video_summary}  
      Caption: {frame_caption}

      Output format (no extra text):

      Score: <float between 0.00 and 1.00>  
      Explanation: <your justification>

    image_wos_woe: |
      You are an expert video summarizer. Given the visual content of a single video frame (image), your task is to:

      Assign an importance score between 0 (not important at all) and 1 (extremely important), indicating how likely this frame should be included in the final video summary.

      Output in the following format (without any extra text):

      Score: <float between 0.00 and 1.00>

    image_wos_we: |
      You are an expert video summarizer. Given the visual content of a single video frame (image), your task is to:

      1. Assign an importance score between 0 (not important at all) and 1 (extremely important), indicating how likely this frame should be included in the final video summary.
      2. Provide a brief explanation (1–2 sentences) justifying your score based on the content of the image.

      Output in the following format (no extra text):

      Score: <float between 0.00 and 1.00>  
      Explanation: <your concise justification>

    image_ws_woe: |
      You are an expert video summarizer. Given:

      1. The overall textual summary of the video;
      2. The visual content of a single video frame (image);

      Your task is to assign an importance score between 0 (not important at all) and 1 (extremely important), indicating how likely this frame should be included in the final video summary.

      Video Summary: {video_summary}  

      Output format (no extra text):

      Score: <float between 0.00 and 1.00>

    image_ws_we: |
      You are an expert video summarizer. Given:

      1. The overall textual summary of the video;
      2. The visual content of a single video frame (image);

      Your task is to:
      1. Assign an importance score between 0 (not important at all) and 1 (extremely important), indicating how likely this frame should be included in the final video summary.
      2. Provide a brief explanation (1–2 sentences) referencing how the visual content relates to the video summary.

      Video Summary: {video_summary}  

      Output format (no extra text):

      Score: <float between 0.00 and 1.00>  
      Explanation: <your justification>
